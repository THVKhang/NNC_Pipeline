# CI of NNC Pipeline: no LLM call, no secret.
#   install      the wheel installed in a clean virtual environment; nnc doctor and kit-check run from outside
#                the repository (phase 17)
#   unit         the unit tests of every stage (deterministic parts, no simulator)
#   kit          the reproduction kit designs/<ip>/sim of each design, run with make only (no NNC), and its
#                outcome compared with the committed results (nnc kit-check): same tests, same failing tests,
#                same failing and never-hit assertions, same NOT_VERIFIABLE checks.
#   kit-configs  the other recorded runs of each run set (sim/configs/<config>/, every seed), make only,
#                each compared with its own recorded result (nnc kit-check --run).
#   formal       SymbiYosys again with the recorded configuration (nnc formal-check): a counterexample that
#                appears or disappears, a vacuous proof, an untranslated check or a tool error fails;
#                PROVEN / BOUNDED / TIMEOUT changes are reported (they depend on the solver time limit).
#   cdc          the structural clock/reset domain crossing check again (nnc cdc --check): a changed verdict or
#                changed counts of synchronized, qualified or unsynchronized crossings fail (phase 20).
# kit-configs and formal take long: they run on main, on pull requests, weekly and by hand, not on every
# push to a feature branch. Tool versions are pinned to the ones the committed results were produced with.
# Designs: the 6 upstream designs, the 3 regenerated or drafted in phases 5-10, spi_master and
# axil_regfile (phase 16, made from a short description), ot_rv_timer and ot_gpio (OpenTitan rv_timer and
# gpio, Apache-2.0; their formal reads the RTL with the yosys-slang plugin of the OSS CAD Suite).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  OSS_CAD_SUITE: "2026-11-07"     # Verilator 5.055, Yosys 0.70+, SymbiYosys, Yices 2.7
  COCOTB: "2.1.0"

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        design: [sync_fifo, apb_tlul_bridge, axi2apb_bridge, async_gray_fifo, async_apb_bridge,
                 ahb2axi_bridge, gen_apb_tlul_bridge, gen_sync_fifo, uart_lite, spi_master, axil_regfile,
                 ot_rv_timer, ot_gpio]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Verilator (OSS CAD Suite) and cocotb
        run: |
          tag="${OSS_CAD_SUITE}"
          curl -fsSL -o "$RUNNER_TEMP/ocs.tgz" \
            "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${tag}/oss-cad-suite-linux-x64-${tag//-/}.tgz"
          tar -xzf "$RUNNER_TEMP/ocs.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/oss-cad-suite/bin" >> "$GITHUB_PATH"
          python -m pip install "cocotb==${COCOTB}"
      - name: Tool versions
        run: |
          verilator --version
          cocotb-config --version
          python --version
      - name: Run the reproduction kit (make only)
        working-directory: designs/${{ matrix.design }}/sim
        run: make regression SEED=1 > sim.log 2>&1 || echo "make returned $?"
      - name: Compare with the committed results
        run: python -m nnc kit-check ${{ matrix.design }}
      - name: Keep the simulation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-${{ matrix.design }}
          path: |
            designs/${{ matrix.design }}/sim/sim.log
            designs/${{ matrix.design }}/sim/results.xml
          if-no-files-found: ignore

  install:
    # The package as a user gets it: wheel built, installed in a clean virtual environment (not editable),
    # run from outside the repository. Fails if a file the flow reads is missing from the wheel.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Verilator (OSS CAD Suite)
        run: |
          tag="${OSS_CAD_SUITE}"
          curl -fsSL -o "$RUNNER_TEMP/ocs.tgz"             "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${tag}/oss-cad-suite-linux-x64-${tag//-/}.tgz"
          tar -xzf "$RUNNER_TEMP/ocs.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/oss-cad-suite/bin" >> "$GITHUB_PATH"
      - name: Build the wheel and install it in a clean virtual environment
        run: |
          python -m pip wheel . --no-deps -w "$RUNNER_TEMP/wheel"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/wheel/*.whl "cocotb==${COCOTB}"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Run the reproduction kit of sync_fifo (make only)
        working-directory: designs/sync_fifo/sim
        run: make regression SEED=1 > sim.log 2>&1 || echo "make returned $?"
      - name: The installed nnc, from outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          nnc --version
          nnc doctor
          python -c "import nnc.gen_rtl as g, nnc.specdraft as s, nnc.sim as m; assert g.RULES_DOC.is_file() and s.TEMPLATE.is_file() and m.SIMLIB.is_file()"
          nnc --root "$GITHUB_WORKSPACE/designs" kit-check sync_fifo

  kit-configs:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        design: [async_gray_fifo, async_apb_bridge, ahb2axi_bridge, uart_lite, spi_master, axil_regfile, ot_rv_timer,
                 ot_gpio]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Verilator (OSS CAD Suite) and cocotb
        run: |
          tag="${OSS_CAD_SUITE}"
          curl -fsSL -o "$RUNNER_TEMP/ocs.tgz" \
            "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${tag}/oss-cad-suite-linux-x64-${tag//-/}.tgz"
          tar -xzf "$RUNNER_TEMP/ocs.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/oss-cad-suite/bin" >> "$GITHUB_PATH"
          python -m pip install "cocotb==${COCOTB}"
      - name: Every other recorded run (make only), each compared with its recorded result
        env:
          PYTHON: python
        run: bash .github/kit_runs.sh ${{ matrix.design }} --skip-primary
      - name: Keep the simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-configs-${{ matrix.design }}
          path: designs/${{ matrix.design }}/sim/runlogs/
          if-no-files-found: ignore

  formal:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        design: [sync_fifo, apb_tlul_bridge, axi2apb_bridge, async_gray_fifo, async_apb_bridge,
                 ahb2axi_bridge, gen_apb_tlul_bridge, gen_sync_fifo, axil_regfile, ot_rv_timer]
        config: [""]
        # A design whose rerun is too long for one runner: one job per formal configuration.
        include:
          - {design: uart_lite, config: base}
          - {design: uart_lite, config: min}
          - {design: uart_lite, config: odd}
          - {design: uart_lite, config: wide}
          - {design: spi_master, config: base}
          - {design: spi_master, config: min}
          - {design: spi_master, config: max}
          - {design: ot_gpio, config: base}
          - {design: ot_gpio, config: sync_off}
          - {design: ot_gpio, config: straps_off}
          - {design: ot_gpio, config: min}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Yosys and SymbiYosys (OSS CAD Suite)
        run: |
          tag="${OSS_CAD_SUITE}"
          curl -fsSL -o "$RUNNER_TEMP/ocs.tgz" \
            "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${tag}/oss-cad-suite-linux-x64-${tag//-/}.tgz"
          tar -xzf "$RUNNER_TEMP/ocs.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/oss-cad-suite/bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          yosys -V
          yices-smt2 --version | head -1
      - name: Formal again, compared with the committed results (no agent, writes nothing)
        run: python -m nnc formal-check ${{ matrix.design }} --workers 4 ${{ matrix.config && format('--config {0}', matrix.config) || '' }}

  cdc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        design: [sync_fifo, apb_tlul_bridge, axi2apb_bridge, async_gray_fifo, async_apb_bridge, ahb2axi_bridge,
                 gen_apb_tlul_bridge, gen_sync_fifo, axil_regfile, uart_lite, spi_master, ot_rv_timer, ot_gpio]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Yosys (OSS CAD Suite)
        run: |
          tag="${OSS_CAD_SUITE}"
          curl -fsSL -o "$RUNNER_TEMP/ocs.tgz" \
            "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${tag}/oss-cad-suite-linux-x64-${tag//-/}.tgz"
          tar -xzf "$RUNNER_TEMP/ocs.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/oss-cad-suite/bin" >> "$GITHUB_PATH"
      - name: Domain crossings again, compared with the committed results (no agent, writes nothing)
        run: python -m nnc cdc ${{ matrix.design }} --check
